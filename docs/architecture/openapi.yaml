components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-onefde_session
    APIKeyCookie:
      type: apiKey
      in: cookie
      name: __Host-onefde_session
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: '400请求语义错误；401未登录/会话过期；403权限/Origin/CSRF错误；404资源不可见；

        409版本、状态、依赖或幂等冲突；422字段校验失败；429限流；500内部错误；503依赖不可用。

        实现时统一FastAPI校验异常为本结构；前端禁止自动重试写操作，显式重试复用原幂等键。


        409也包含INPUTS_PENDING、RUN_NOT_STOPPED、REVIEW_VERSION_MISMATCH、TASK_CLOSED；422用于字段/结构错误。

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
