      type: object
      additionalProperties: false
      required:
      - command
      - expected_revision
      - expected_run_id
      properties:
        command:
          type: string
          enum:
          - queue
          - start
          - retry
          - continue
          - cancel
          - stop_for_update
        expected_revision:
          type: integer
          minimum: 1
        expected_run_id:
          type:
          - string
          - 'null'
          format: uuid
        model_profile_revision_id:
          type: string
          format: uuid
          description: start/retry/continue必需；从已配置的有效修订选择，新Run固定该配置
      allOf:
      - if:
          properties:
            command:
              enum:
              - start
              - retry
              - continue
        then:
          required:
          - model_profile_revision_id
      - if:
          properties:
            command:
              enum:
              - queue
              - start
        then:
          properties:
            expected_run_id:
              type: 'null'
      - if:
          properties:
            command:
              enum:
              - retry
              - continue
              - stop_for_update
        then:
          properties:
            expected_run_id:
              type: string
              format: uuid
