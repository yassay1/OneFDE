          type: string
          format: uuid
        task_spec_version:
          type: integer
          minimum: 1
        attempt:
          type: integer
          minimum: 1
        state:
          type: string
          enum:
          - queued
          - running
          - cancel_requested
          - completed
          - failed
          - cancelled
          - interrupted
        model_profile_revision_id:
          type:
          - string
          - 'null'
          format: uuid
        result_summary:
          type:
          - string
          - 'null'
        error_code:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        outcome:
          type:
          - string
          - 'null'
          enum:
          - submitted
          - needs_input
          - superseded
          - null
        applied_input_ids:
          type: array
          items:
            type: string
            format: uuid
      allOf:
      - if:
          properties:
            state:
              const: completed
        then:
          properties:
            outcome:
              type: string
              enum:
              - submitted
              - needs_input
              - superseded
        else:
          properties:
            outcome:
