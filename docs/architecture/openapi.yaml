components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: __Host-onefde_session
    APIKeyCookie:
      type: apiKey
      in: cookie
      name: __Host-onefde_session
    HTTPBearer:
      type: http
      scheme: bearer
  parameters:
    Csrf:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 1
    Idempotency:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 128
    Cursor:
      name: cursor
      in: query
      schema:
        type: string
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    TaskId:
      name: task_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: run_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    Error:
      description: '400请求语义错误；401未登录/会话过期；403权限/Origin/CSRF错误；404资源不可见；

        409版本、状态、依赖或幂等冲突；422字段校验失败；429限流；500内部错误；503依赖不可用。

        实现时统一FastAPI校验异常为本结构；前端禁止自动重试写操作，显式重试复用原幂等键。


        409也包含INPUTS_PENDING、RUN_NOT_STOPPED、REVIEW_VERSION_MISMATCH、TASK_CLOSED；422用于字段/结构错误。

        '
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ApiError:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        request_id:
          type: string
          title: Request Id
        details:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Details
      type: object
      required:
      - code
      - message
      - request_id
      title: ApiError
    OwnerSession:
      properties:
        username:
          type: string
          title: Username
        csrf_token:
          type: string
          title: Csrf Token
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - username
      - csrf_token
      - expires_at
      title: OwnerSession
    EngagementCreate:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          pattern: \S
          title: Title
        is_demo:
          type: boolean
          title: Is Demo
        goal:
          type: string
          minLength: 1
          pattern: \S
          title: Goal
      additionalProperties: false
      type: object
      required:
      - title
      - is_demo
      - goal
      title: EngagementCreate
    Engagement:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          pattern: \S
          title: Title
        is_demo:
          type: boolean
          title: Is Demo
        goal:
          type: string
          minLength: 1
          pattern: \S
          title: Goal
        id:
          type: string
          format: uuid
          title: Id
        created_at:
          type: string
          format: date-time
          title: Created At
      additionalProperties: false
      type: object
      required:
      - title
      - is_demo
      - goal
      - id
      - created_at
      title: Engagement
    TaskSpec:
      properties:
        title:
          type: string
          maxLength: 200
          minLength: 1
          pattern: \S
          title: Title
        objective:
          type: string
          minLength: 1
          pattern: \S
          title: Objective
        scope:
          type: string
          minLength: 1
          pattern: \S
          title: Scope
        inputs:
          items:
            type: string
          type: array
          title: Inputs
        confirmed_rules:
          items:
            type: string
          type: array
          title: Confirmed Rules
        completion_criteria:
          items:
            type: string
            minLength: 1
            pattern: \S
          type: array
          minItems: 1
          title: Completion Criteria
        dependencies:
          items:
            $ref: '#/components/schemas/Dependency'
          type: array
          title: Dependencies
        capability_versions:
          items:
            type: string
          type: array
          title: Capability Versions
      additionalProperties: false
      type: object
      required:
      - title
      - objective
      - scope
      - inputs
      - confirmed_rules
      - completion_criteria
      - dependencies
      - capability_versions
      title: TaskSpec
    TaskCreate:
      properties:
        request_id:
          type: string
          format: uuid
          title: Request Id
        task_key:
          type: string
          maxLength: 128
          minLength: 1
          pattern: \S
          title: Task Key
        original_request:
          type: string
          minLength: 1
          pattern: \S
          title: Original Request
        spec:
          $ref: '#/components/schemas/TaskSpec'
        owner_role:
          type: string
          const: fde
          title: Owner Role
        executor_role:
          type: string
          const: engineering
          title: Executor Role
        related_task_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Related Task Id
      additionalProperties: false
      type: object
      required:
      - request_id
      - task_key
      - original_request
      - spec
      - owner_role
      - executor_role
      title: TaskCreate
    Task:
      properties:
        id:
