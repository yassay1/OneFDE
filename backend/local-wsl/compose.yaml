name: onefde-wsl
services:
  postgres:
    restart: unless-stopped
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    environment:
      POSTGRES_USER: onefde
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Local private .env required}
      POSTGRES_DB: onefde_wsl_dev
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - database:/var/lib/postgresql/data
    cpus: 0.5
    mem_limit: 384m
    pids_limit: 128
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onefde -d onefde_wsl_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  database:
