name: onefde-local
x-app: &app
  image: onefde-local-app:locked
  build:
    context: ..
    dockerfile: deploy/Dockerfile
    network: none
    additional_contexts:
      tools: /srv/onefde-local/build-tools
      uvcache: /home/onefde/.cache/uv
  read_only: true
  user: "10001:10001"
  init: true
  cpus: 1
  mem_limit: 512m
  memswap_limit: 512m
  pids_limit: 128
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: ["/tmp:rw,nosuid,nodev,size=67108864,mode=1777"]
  logging: {driver: local, options: {max-size: "10m", max-file: "3"}}

x-api-env: &api-env
  ONEFDE_DATABASE_URL_FILE: /run/secrets/api_url
  ONEFDE_OWNER_PASSWORD_HASH_FILE: /run/secrets/owner_hash
  ONEFDE_OWNER_USERNAME: founder
  ONEFDE_ENVIRONMENT: development
  ONEFDE_COOKIE_SECURE: "false"
  ONEFDE_TRUSTED_ORIGIN: http://127.0.0.1:8002

services:
  postgres:
    image: postgres:17.7-bookworm@sha256:86e0b703649d7a792bd9243ee28afc9d8f7c6b2b5638077c9d6882d4d472bbfd
    environment:
      POSTGRES_USER: onefde
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
      POSTGRES_DB: onefde_compose_dev
    secrets: [admin_password]
    volumes: [pgdata:/var/lib/postgresql/data]
    networks:
      control: {ipv4_address: 172.29.240.3}
    cpus: 0.5
    mem_limit: 384m
    memswap_limit: 384m
    pids_limit: 128
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U onefde -d onefde_compose_dev"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
  api:
    <<: *app
    command: [api]
    environment: *api-env
    secrets: [api_url, owner_hash]
    ports: ["127.0.0.1:8002:8000"]
    networks:
      control: {ipv4_address: 172.29.240.2}
      local_access: {}
    cpus: 0.5
    mem_limit: 512m
    pids_limit: 128
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=2)"]
      interval: 10s
      timeout: 4s
      retries: 5
  worker:
    <<: *app
    command: [worker]
    environment:
      HOME: /tmp
      ONEFDE_WORKER_DATABASE_URL_FILE: /run/secrets/worker_url
      ONEFDE_MODEL_ENGINEERING_FILE: /run/secrets/deepseek_api_key
      ONEFDE_WORKER_EXECUTION_MODE: ecs_shared
      ONEFDE_WORKER_SHARED_HOST_CONFIRMED: "true"
      ONEFDE_WORKER_ISOLATED_HOST_CONFIRMED: "false"
      ONEFDE_WORKER_MODEL_EXECUTION_ENABLED: "false"
      ONEFDE_WORKER_WORKER_ID: onefde-local-worker
      ONEFDE_WORKER_ROOT: /srv/onefde-local/worker
      ONEFDE_WORKER_NETWORK: onefde-local-sandbox
      ONEFDE_WORKER_EGRESS_PROXY_URL: http://172.29.241.3:3128
      ONEFDE_WORKER_STORAGE_LIMIT_BYTES: "2147483648"
      ONEFDE_WORKER_MIN_FREE_MEMORY_MB: "4096"
    secrets: [worker_url, deepseek_api_key]
    group_add: ["${DOCKER_GID:?Read local socket group}"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /srv/onefde-local/worker:/srv/onefde-local/worker
    networks:
      control: {ipv4_address: 172.29.240.4}
      sandbox: {ipv4_address: 172.29.241.2}
    cpus: 0.5
    mem_limit: 1g
    memswap_limit: 1g
    pids_limit: 128
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, /app/ops/launch.py, check]
      interval: 15s
      timeout: 10s
      retries: 3
  egress:
    image: ubuntu/squid@sha256:6a097f68bae708cedbabd6188d68c7e2e7a38cedd05a176e1cc0ba29e3bbe029
    entrypoint: [squid]
    command: [-N, -f, /etc/squid/squid.conf]
    user: "13:13"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    tmpfs: ["/tmp:rw,nosuid,nodev,size=16777216,mode=1777", "/run:rw,nosuid,nodev,size=1048576,mode=777"]
    volumes: ["./squid.conf:/etc/squid/squid.conf:ro"]
    networks:
      sandbox: {ipv4_address: 172.29.241.3}
      offline_out: {ipv4_address: 203.0.113.3}
      model_out: {ipv4_address: 172.29.242.3}
    cpus: 0.25
    mem_limit: 128m
    memswap_limit: 128m
    pids_limit: 64
    restart: unless-stopped
    logging: {driver: local, options: {max-size: "10m", max-file: "3"}}
  migrate:
    <<: *app
    command: [migrate]
    profiles: [ops]
    environment:
      <<: *api-env
      ONEFDE_DATABASE_URL_FILE: /run/secrets/admin_url
    secrets: [admin_url, owner_hash]
    networks: [control]
    depends_on:
      postgres: {condition: service_healthy}
  initialize:
    <<: *app
    command: [initialize]
    profiles: [ops]
    environment:
      ONEFDE_DATABASE_URL_FILE: /run/secrets/admin_url
    secrets: [admin_url, api_password, worker_password]
    networks: [control]
    depends_on:
      postgres: {condition: service_healthy}
  configure-model:
    <<: *app
    command: [configure-model]
    profiles: [ops]
    environment:
      ONEFDE_WORKER_DATABASE_URL_FILE: /run/secrets/admin_url
    secrets: [admin_url]
    volumes: ["/srv/onefde-local/private/deepseek-profile.json:/run/config/deepseek-profile.json:ro"]
    networks: [control]
    depends_on:
      postgres: {condition: service_healthy}
  probe:
    <<: *app
    entrypoint: [python, /app/ops/probe.py]
    profiles: [checks]
    networks:
      offline_out:
        ipv4_address: 203.0.113.2
        aliases: [onefde-probe.test]
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.1
    pids_limit: 32

networks:
  model_out:
    name: onefde-local-model-out
    driver_opts: {com.docker.network.bridge.name: ofde-model0}
    ipam: {config: [{subnet: 172.29.242.0/24}]}
  local_access:
    name: onefde-local-access
  control:
    name: onefde-local-control
    internal: true
    ipam: {config: [{subnet: 172.29.240.0/24}]}
  sandbox:
    name: onefde-local-sandbox
    internal: true
    driver_opts: {com.docker.network.bridge.name: ofde-shared0}
    ipam: {config: [{subnet: 172.29.241.0/24}]}
  offline_out:
    name: onefde-local-offline-out
    internal: true
    ipam: {config: [{subnet: 203.0.113.0/24}]}
volumes:
  pgdata:
secrets:
  deepseek_api_key: {file: /srv/onefde-local/private/deepseek_api_key}
  admin_password: {file: /srv/onefde-local/private/admin_password}
  admin_url: {file: /srv/onefde-local/private/admin_url}
  api_url: {file: /srv/onefde-local/private/api_url}
  api_password: {file: /srv/onefde-local/private/api_password}
  worker_url: {file: /srv/onefde-local/private/worker_url}
  worker_password: {file: /srv/onefde-local/private/worker_password}
  owner_hash: {file: /srv/onefde-local/private/owner_hash}
